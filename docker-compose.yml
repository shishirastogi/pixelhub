services:
  postgres:
    image: postgres:15-alpine
    container_name: pixelhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixelhub
      POSTGRES_PASSWORD: pixelhub
      POSTGRES_DB: pixelhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pixelhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: pixelhub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pixelhub
      MINIO_ROOT_PASSWORD: pixelhub-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: pixelhub-minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 pixelhub pixelhub-secret; do
          echo "waiting for minio..."; sleep 2;
        done;
        mc mb --ignore-existing local/pixelhub;
        echo "MinIO bucket ready";

volumes:
  postgres-data:
  redis-data:
  minio-data:
